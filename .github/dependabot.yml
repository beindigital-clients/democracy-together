version: 2

# The repo had no Dependabot (audit § 6.2): the Next upgrade
# 16.2.9 -> 16.3.5, which fixed an unauthenticated RCE, only happened after
# a manual audit. An automatic alert would have surfaced the advisory as soon
# as it was published.

updates:
  # --- npm ------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Grouping fixes avoids one PR per transitive package: a single
    # review pass for the risk-free version bumps.
    groups:
      correctifs:
        update-types:
          - patch
      mineures-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # React and Next move together: their major upgrades are decided
      # by hand, not as they come.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
    labels:
      - dependencies

  # --- GitHub actions -------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
