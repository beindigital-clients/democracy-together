name: E2E (Playwright)

# Les tests E2E exigent un VRAI déploiement Convex : le parcours d'auth crée un
# compte, lit un code OTP en base et ouvre une session. C'était le blocage de
# l'audit (§ 6.1) — d'où un workflow jusqu'ici manuel.
#
# Ce workflow lève le blocage : chaque pull request obtient un déploiement Convex
# de PRÉVERSION dédié, créé puis peuplé à la volée, détruit et recréé à la
# poussée suivante (`--preview-create`). Le jeu de données est donc neuf à chaque
# exécution, et aucun test ne dépend de ce qu'un run précédent a laissé.
#
# ─── Ce qu'il faut provisionner UNE FOIS (accès Convex requis) ────────────────
#
# 1. Secret de dépôt `CONVEX_DEPLOY_KEY` — une clé de déploiement de type
#    « Preview », générée dans le tableau de bord Convex :
#      Project Settings -> Deploy keys -> Generate preview deploy key
#    Elle est limitée par construction aux déploiements de préversion : elle NE
#    PEUT PAS écrire en production. Ne jamais mettre ici une clé de prod.
#
# 2. Variables par défaut des préversions du projet (elles sont posées à la
#    naissance de chaque préversion, et n'existent QUE pour ce type de
#    déploiement — la production n'est pas touchée) :
#      npx convex env default set --type preview JWT_PRIVATE_KEY "<clé RS256>"
#      npx convex env default set --type preview JWKS '<jwks json>'
#    (paire générée par `npx @convex-dev/auth`, cf. .env.example)
#
# Rien d'autre : l'URL du déploiement est découverte à l'exécution, et
# `AUTH_DEV_OTP` / `RECAPTCHA_DISABLED` sont posés ci-dessous sur la seule
# préversion nommée. C'est la garantie tenue par ce fichier : ces deux
# variables ne sont écrites nulle part ailleurs, et la clé utilisée ne donne
# pas accès à la production.
#
# Tant que le secret n'est pas configuré, le job E2E est IGNORÉ (et non rouge) :
# faire rougir toutes les PR pour une raison d'environnement apprend aux
# relecteurs à ignorer le rouge. Le typage des tests, lui, tourne toujours —
# mais dans `ci.yml` (« Typecheck (tests) »), qui ne dépend d'aucun secret.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Secrets de préversion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    # Ni dépôt ni dépendances : ce job ne fait que LIRE un secret pour décider
    # si le job suivant peut tourner. Le typage des tests (`pnpm
    # typecheck:tests`, issue #18) vivait ici faute de mieux ; il est désormais
    # dans `ci.yml`, aux côtés des deux autres commandes de typage — même
    # nature, aucun secret, et il tourne donc sur chaque PR même quand les E2E
    # sont ignorés. L'y laisser AUSSI, c'était payer deux installations de
    # dépendances par PR pour la même vérification.
    steps:
      - name: Déploiement de préversion configuré ?
        id: secrets
        env:
          DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E ignorés::Le secret CONVEX_DEPLOY_KEY (clé de préversion) n'est pas configuré sur le dépôt. Voir l'en-tête de .github/workflows/e2e.yml."
          fi

  e2e:
    name: Parcours navigateur
    needs: preflight
    # Le contexte `secrets` n'est pas lisible dans un `if` de job : la décision
    # vient du job précédent. Une PR issue d'un fork n'a pas les secrets -> le
    # job est ignoré, pas en échec.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nommer la préversion
        run: |
          echo "CONVEX_PREVIEW_NAME=e2e-${{ github.event.pull_request.number || github.run_id }}" >> "$GITHUB_ENV"

      # Crée (ou recrée) la préversion et y pousse le backend. `--cmd` s'exécute
      # avec l'URL du déploiement dans l'environnement : on la propage aux
      # étapes suivantes, qui en ont besoin pour le build Next et pour lire les
      # codes OTP.
      - name: Déployer le backend sur une préversion dédiée
        run: |
          npx convex deploy \
            --preview-create "$CONVEX_PREVIEW_NAME" \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd 'echo "NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"'

      # PORTÉE : `--preview-name` désigne explicitement la préversion qui vient
      # d'être créée, et la clé employée est une clé de préversion. AUTH_DEV_OTP
      # ne peut donc pas atteindre la production depuis ce workflow.
      #
      # RECAPTCHA_DISABLED : depuis l'issue #24, un formulaire public sans clé
      # reCAPTCHA est REJETÉ. Le contournement doit donc être demandé
      # explicitement ici — c'est exactement ce que la correction visait :
      # rendre visible qui désactive la protection, et où.
      - name: Poser les variables de test sur CETTE préversion uniquement
        run: |
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" AUTH_DEV_OTP true
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" RECAPTCHA_DISABLED true
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" SITE_URL http://localhost:3000

      - name: Vérifier les clés Convex Auth de la préversion
        run: |
          missing=""
          for v in JWT_PRIVATE_KEY JWKS; do
            value=$(npx convex env get --preview-name "$CONVEX_PREVIEW_NAME" "$v" 2>/dev/null || true)
            if [ -z "$value" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Préversion incomplète::Variables absentes :$missing. Posez-les comme valeurs par défaut des préversions du projet (npx convex env default set --type preview ...). Voir l'en-tête de ce workflow."
            exit 1
          fi

      # Une préversion naît VIDE : sans ce peuplement, la bibliothèque et
      # l'annuaire n'ont rien à montrer et la moitié des parcours échouerait
      # pour une raison qui n'est pas un défaut du code.
      - name: Peupler le jeu de données de démonstration
        run: |
          npx convex run --preview-name "$CONVEX_PREVIEW_NAME" seed:seedDirectory '{}'
          npx convex run --preview-name "$CONVEX_PREVIEW_NAME" seedPublications:seedPublications '{}'

      # Un seul navigateur : les projets `chromium` (desktop) et
      # `mobile-chromium` (viewport téléphone + tactile) partagent le binaire.
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lancer les E2E
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm test:e2e

      # QUELS tests tombent, et pourquoi — une vingtaine de lignes par échec.
      # Le pas suivant imprime les captures de page : elles font plusieurs
      # centaines de lignes chacune, et l'erreur s'y perdait au point qu'il
      # fallait une exécution de plus rien que pour lister les échecs (issue #66).
      - name: Échecs (nom et erreur)
        if: failure()
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            case "$f" in *-retry*) continue ;; esac
            sed -n '/^# Test info/,/^```yaml/p' "$f" | sed '$d' | sed '/^# Page snapshot$/d'
            echo "-----"
          done
        shell: bash

      # Quand la suite échoue, le log porte l'INSTANTANÉ DE PAGE de chaque
      # échec. Sans cela, il faut télécharger l'artefact — ce que certains
      # environnements interdisent (proxy d'entreprise, agent en bac à sable) —
      # et c'est précisément quand ça casse qu'on a besoin de voir l'écran.
      # Les reprises (`-retry1`) sont écartées : même page, deux fois. L'en-tête
      # n'est pas répété ici, il est au pas ci-dessus.
      - name: Instantanés des échecs
        if: failure()
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            case "$f" in *-retry*) continue ;; esac
            echo "----- $f -----"
            awk '/^```yaml/{y=1} y && n++ < 120' "$f"
            echo
          done
        shell: bash

      # Fin du journal du serveur Next. C'est là — et nulle part ailleurs — que se
      # lit la cause d'une page qui répond 500 ; le navigateur, lui, ne voit
      # qu'« Internal Server Error ». Ce journal a révélé successivement l'export
      # `isAuthenticated` manquant (toutes les pages connectées en 500) puis le
      # projet Sanity « placeholder » en CI : il reste.
      - name: Journal du serveur (fin)
        if: failure()
        run: tail -c 6000 server.log || echo "(pas de server.log)"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
