name: E2E (Playwright)

# E2E tests require a REAL Convex deployment: the auth flow creates an
# account, reads an OTP code from the database and opens a session. This was the
# audit's blocker (§ 6.1) — hence a workflow that was manual until now.
#
# This workflow removes the blocker: each pull request gets a dedicated Convex
# PREVIEW deployment, created then seeded on the fly, destroyed and recreated on
# the next push (`--preview-create`). The dataset is therefore fresh on every
# run, and no test depends on what a previous run left behind.
#
# ─── What must be provisioned ONCE (Convex access required) ────────────────
#
# 1. Repository secret `CONVEX_DEPLOY_KEY` — a deploy key of type
#    "Preview", generated in the Convex dashboard:
#      Project Settings -> Deploy keys -> Generate preview deploy key
#    By construction it is limited to preview deployments: it CANNOT
#    write to production. Never put a prod key here.
#
# 2. Default variables for the project's previews (they are set when
#    each preview is born, and exist ONLY for this type of
#    deployment — production is not touched):
#      npx convex env default set --type preview JWT_PRIVATE_KEY "<RS256 key>"
#      npx convex env default set --type preview JWKS '<jwks json>'
#    (pair generated by `npx @convex-dev/auth`, see .env.example)
#
# Nothing else: the deployment URL is discovered at runtime, and
# `AUTH_DEV_OTP` / `RECAPTCHA_DISABLED` are set below on the named
# preview only. This is the guarantee this file upholds: these two
# variables are written nowhere else, and the key used gives no
# access to production.
#
# Until the secret is configured, the E2E job is SKIPPED (not red):
# turning every PR red for an environment reason teaches
# reviewers to ignore red. Test type-checking, for its part, always runs —
# but in `ci.yml` ("Typecheck (tests)"), which depends on no secret.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Secrets de préversion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.secrets.outputs.configured }}
    # No checkout, no dependencies: this job only READS a secret to decide
    # whether the next job can run. Test type-checking (`pnpm
    # typecheck:tests`, issue #18) lived here for lack of a better place; it is now
    # in `ci.yml`, alongside the other two typing commands — same
    # nature, no secret, so it runs on every PR even when the E2E
    # are skipped. Keeping it here TOO meant paying for two dependency
    # installs per PR for the same check.
    steps:
      - name: Déploiement de préversion configuré ?
        id: secrets
        env:
          DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -n "$DEPLOY_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=E2E ignorés::Le secret CONVEX_DEPLOY_KEY (clé de préversion) n'est pas configuré sur le dépôt. Voir l'en-tête de .github/workflows/e2e.yml."
          fi

  e2e:
    name: Parcours navigateur
    needs: preflight
    # The `secrets` context is not readable in a job-level `if`: the decision
    # comes from the previous job. A PR from a fork does not have the secrets -> the
    # job is skipped, not failed.
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nommer la préversion
        run: |
          echo "CONVEX_PREVIEW_NAME=e2e-${{ github.event.pull_request.number || github.run_id }}" >> "$GITHUB_ENV"

      # Creates (or recreates) the preview and pushes the backend to it. `--cmd` runs
      # with the deployment URL in the environment: we propagate it to the
      # following steps, which need it for the Next build and to read the
      # OTP codes.
      - name: Déployer le backend sur une préversion dédiée
        run: |
          npx convex deploy \
            --preview-create "$CONVEX_PREVIEW_NAME" \
            --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL \
            --cmd 'echo "NEXT_PUBLIC_CONVEX_URL=$NEXT_PUBLIC_CONVEX_URL" >> "$GITHUB_ENV"'

      # SCOPE: `--preview-name` explicitly targets the preview that was just
      # created, and the key used is a preview key. AUTH_DEV_OTP
      # therefore cannot reach production from this workflow.
      #
      # RECAPTCHA_DISABLED: since issue #24, a public form without a reCAPTCHA
      # key is REJECTED. The bypass must therefore be requested
      # explicitly here — which is exactly what the fix aimed at:
      # making visible who disables the protection, and where.
      - name: Poser les variables de test sur CETTE préversion uniquement
        run: |
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" AUTH_DEV_OTP true
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" RECAPTCHA_DISABLED true
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" SITE_URL http://localhost:3000
          # FAKE payment provider (F-28, paiements-don.spec.ts):
          # refused by the server without AUTH_DEV_OTP and when a production
          # key is present (convex/lib/payments/config.ts).
          npx convex env set --preview-name "$CONVEX_PREVIEW_NAME" PAYMENTS_FAKE_PROVIDER 1

      - name: Vérifier les clés Convex Auth de la préversion
        run: |
          missing=""
          for v in JWT_PRIVATE_KEY JWKS; do
            value=$(npx convex env get --preview-name "$CONVEX_PREVIEW_NAME" "$v" 2>/dev/null || true)
            if [ -z "$value" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Préversion incomplète::Variables absentes :$missing. Posez-les comme valeurs par défaut des préversions du projet (npx convex env default set --type preview ...). Voir l'en-tête de ce workflow."
            exit 1
          fi

      # A preview is born EMPTY: without this seeding, the library and the
      # directory have nothing to show and half the flows would fail
      # for a reason that is not a code defect.
      - name: Peupler le jeu de données de démonstration
        run: |
          npx convex run --preview-name "$CONVEX_PREVIEW_NAME" seed:seedDirectory '{}'
          npx convex run --preview-name "$CONVEX_PREVIEW_NAME" seedPublications:seedPublications '{}'
          # Editorial content ("contenus" workstream): the hard-coded agenda, replays,
          # partners and themes are copied into the database. Without
          # this import, the first event created by `contenus-*.spec.ts`
          # would switch the agenda from its hard-coded fallback to a table that
          # contains only that event. Idempotent (docs/backlog/contenus.md).
          npx convex run --preview-name "$CONVEX_PREVIEW_NAME" contenus/migration:importCodedContent '{}'

      # A single browser: the `chromium` (desktop) and
      # `mobile-chromium` (phone viewport + touch) projects share the binary.
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lancer les E2E
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm test:e2e

      # WHICH tests fail, and why — about twenty lines per failure.
      # The next step prints the page snapshots: they run to several
      # hundred lines each, and the error got so lost in them that it
      # took an extra run just to list the failures (issue #66).
      - name: Échecs (nom et erreur)
        if: failure()
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            case "$f" in *-retry*) continue ;; esac
            sed -n '/^# Test info/,/^```yaml/p' "$f" | sed '$d' | sed '/^# Page snapshot$/d'
            echo "-----"
          done
        shell: bash

      # When the suite fails, the log carries the PAGE SNAPSHOT of each
      # failure. Without it, you have to download the artifact — which some
      # environments forbid (corporate proxy, sandboxed agent) —
      # and it is precisely when things break that you need to see the screen.
      # Retries (`-retry1`) are skipped: same page, twice. The header
      # is not repeated here, it is in the step above.
      - name: Instantanés des échecs
        if: failure()
        run: |
          shopt -s globstar nullglob
          for f in test-results/**/error-context.md; do
            case "$f" in *-retry*) continue ;; esac
            echo "----- $f -----"
            awk '/^```yaml/{y=1} y && n++ < 120' "$f"
            echo
          done
        shell: bash

      # Tail of the Next server log. This is where — and nowhere else — the
      # cause of a page responding 500 can be read; the browser only
      # sees "Internal Server Error". This log successively revealed the missing
      # `isAuthenticated` export (every signed-in page returning 500) and then the
      # "placeholder" Sanity project in CI: it stays.
      - name: Journal du serveur (fin)
        if: failure()
        run: tail -c 6000 server.log || echo "(pas de server.log)"

      - name: Publier le rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
