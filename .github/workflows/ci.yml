name: CI

# The repo had no continuous integration at all (audit § 6.2): nothing
# guaranteed that `main` compiles, that tests pass, or that no vulnerable
# dependency gets in. This workflow reproduces exactly what a contributor
# runs locally, with no secret or external service — so it is deterministic and
# cannot go red for an environment reason.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push on a PR cancels the previous one: no point paying
# twice for the same check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm BEFORE setup-node: `cache: pnpm` needs the binary to
      # locate the store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # The three typechecks and the unit tests below also run BEFORE every
      # push, in the husky pre-push hook (`pnpm verify`, scripts/verify.mjs).
      # They run again here: a hook can be skipped (`--no-verify`, a clone
      # where `pnpm install` never ran), and the shuffled order and the build
      # run only here.
      #
      # The root tsconfig EXCLUDES convex/, tests/ and *.test.*: without the next
      # two commands, 9,578 lines of backend and the whole test suite would
      # be type-checked by no script at all (audit § 6.2). `next build` compiles the
      # backend, but too late for fast feedback — and never looks at
      # `tests/`.
      - name: Typecheck (application)
        run: pnpm typecheck

      - name: Typecheck (backend Convex)
        run: pnpm typecheck:convex

      # Issue #18: `test.use({ reducedMotion })` — an option that doesn't exist in the
      # pinned Playwright — lived for months in `globe-touch.spec.ts` because
      # NO command type-checked `tests/`. It was silently ignored: the
      # test went green without ever enabling `prefers-reduced-motion`. This
      # command is the safeguard, and it belongs in THIS workflow: like the
      # two previous ones, it is deterministic and needs no secret.
      # Since 02/10/2026 it also types the Vitest files of `convex/` and
      # `src/` and the `.tsx` of `tests/unit/`, which until then were only
      # transpiled (see `tsconfig.tests.json`).
      - name: Typecheck (tests)
        run: pnpm typecheck:tests

      - name: Tests unitaires
        run: pnpm test

      # Same suite, SHUFFLED ORDER (audit F-01).
      #
      # `pnpm test` runs files in declaration order, always the
      # same: an order dependency stays invisible there. Measured before
      # the fix, the suite was green here and went red six times out of ten in
      # shuffled order — up to twelve tests at once. Green by scheduling
      # luck, then, with two isolation defects no review
      # would have caught: a spy on `window.localStorage` that
      # `vi.restoreAllMocks()` does not restore under happy-dom, and an
      # `input-otp` timer that outlived its file.
      #
      # The seed is DRAWN ON EVERY RUN: that is the point — we want to
      # explore orders, not freeze one. Vitest prints the seed used
      # at the top of the report, and `--sequence.seed=<n>` replays exactly the same
      # order for diagnosis.
      - name: Tests unitaires (ordre mélangé)
        run: pnpm exec vitest run --sequence.shuffle

      # No environment variables: the build is green without a Convex
      # deployment. If that stops being true, it is a
      # regression to fix, not a secret to add here.
      - name: Build de production
        run: pnpm build

  lint:
    name: Lint · formatage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # SEPARATE job from `verify`: lint and typing fail for different
      # reasons and read better side by side than in sequence. Both
      # run in parallel, so feedback is no slower.
      #
      # ESLint is configured all-error (no rule set to `warn`) and
      # `reportUnusedDisableDirectives` is an error: an `eslint-disable`
      # directive that became useless turns this job red rather than
      # lying dormant in the code.
      - name: ESLint
        run: pnpm lint

      # The pre-commit hook can be bypassed (`--no-verify`, or a
      # contributor who never ran `pnpm install`). This check is the
      # safety net: it fails if a file is not formatted, without rewriting anything.
      - name: Prettier (contrôle, sans écriture)
        run: pnpm format:check

  audit:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # SEPARATE job, on purpose: a new advisory published on a transitive
      # dependency can turn this job red without a single line having changed.
      # Isolating it avoids confusing "the code is broken" with "the world has
      # moved". The `high` threshold is sustainable: the tree has had 0 critical and
      # 0 high advisories since the Next 16.3.5 upgrade and the pnpm overrides.
      #
      # STATUS AS OF 21/09/2026 (F-08) — 9 advisories brought down to 1:
      #   postcss   bumped to ^8.5.23, including a `postcss@8` override, otherwise
      #             @tailwindcss/postcss kept a nested copy at 8.5.15
      #             (it was the only HIGH advisory in the tree);
      #   vitest    ^4.1.11 (itself and @vitest/mocker);
      #   overrides bounded to the major, like the previous ones: dompurify@3,
      #             baseline-browser-mapping@2, valibot@1.
      #
      # The last one, GHSA-w5hq-g745-h8pq (uuid < 11.1.1, moderate), came in
      # through the Sanity CLI (`sanity > @sanity/cli > typeid-js > uuid`): it
      # left with Sanity (01/10/2026).
      - name: pnpm audit (production, seuil haut)
        run: pnpm audit --prod --audit-level=high
