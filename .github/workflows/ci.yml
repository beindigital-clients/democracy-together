name: CI

# Le dépôt n'avait aucune intégration continue (audit § 6.2) : rien ne
# garantissait que `main` compile, que les tests passent, ni qu'une dépendance
# vulnérable n'entre. Ce workflow reproduit exactement ce qu'un contributeur
# lance en local, sans secret ni service externe — il est donc déterministe et
# ne peut pas rougir pour une raison d'environnement.

on:
  pull_request:
  push:
    branches:
      - doums85/democracy-app-features
  workflow_dispatch:

# Une nouvelle poussée sur une PR annule la précédente : inutile de payer
# deux fois la même vérification.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm AVANT setup-node : `cache: pnpm` a besoin du binaire pour
      # localiser le store.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Le tsconfig racine EXCLUT convex/, tests/ et *.test.* : sans les deux
      # commandes suivantes, 9 578 lignes de backend et l'ensemble des tests ne
      # seraient typés par aucun script (audit § 6.2). `next build` compile le
      # backend, mais trop tard pour un retour rapide — et ne regarde jamais
      # `tests/`.
      - name: Typecheck (application)
        run: pnpm typecheck

      - name: Typecheck (backend Convex)
        run: pnpm typecheck:convex

      # Issue #18 : `test.use({ reducedMotion })` — option inexistante dans le
      # Playwright épinglé — a vécu des mois dans `globe-touch.spec.ts` parce
      # qu'AUCUNE commande ne typait `tests/`. Elle était ignorée en silence : le
      # test passait au vert sans jamais activer `prefers-reduced-motion`. Cette
      # commande est le garde-fou, et elle appartient à CE workflow : comme les
      # deux précédentes, elle est déterministe et ne demande aucun secret.
      - name: Typecheck (tests)
        run: pnpm typecheck:tests

      - name: Tests unitaires
        run: pnpm test

      # Même suite, ORDRE MÉLANGÉ (audit F-01).
      #
      # `pnpm test` joue les fichiers dans l'ordre de déclaration, toujours le
      # même : une dépendance d'ordre y reste invisible. Mesuré avant
      # correctif, la suite était verte ici et rougissait six fois sur dix en
      # ordre mélangé — jusqu'à douze tests d'un coup. Verte par chance
      # d'ordonnancement, donc, et deux défauts d'isolation qu'aucune
      # relecture n'aurait vus : un espion sur `window.localStorage` que
      # `vi.restoreAllMocks()` ne restaure pas sous happy-dom, et une minuterie
      # d'`input-otp` qui survivait à son fichier.
      #
      # La graine est TIRÉE À CHAQUE EXÉCUTION : c'est le but — on veut
      # explorer des ordres, pas en figer un. Vitest imprime la graine employée
      # en tête de rapport, et `--sequence.seed=<n>` rejoue exactement le même
      # ordre pour diagnostiquer.
      - name: Tests unitaires (ordre mélangé)
        run: pnpm exec vitest run --sequence.shuffle

      # Aucune variable d'environnement : le build est vert sans déploiement
      # Convex ni projet Sanity. Si cela cesse d'être vrai, c'est une
      # régression à corriger, pas un secret à ajouter ici.
      - name: Build de production
        run: pnpm build

  lint:
    name: Lint · formatage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Job SÉPARÉ de `verify` : lint et typage échouent pour des raisons
      # différentes et se lisent mieux côte à côte qu'en file. Les deux
      # tournent en parallèle, le retour n'est donc pas plus lent.
      #
      # ESLint est configuré en tout-erreur (aucune règle en `warn`) et
      # `reportUnusedDisableDirectives` est en erreur : une directive
      # `eslint-disable` devenue inutile fait rougir ce job plutôt que de
      # rester à dormir dans le code.
      - name: ESLint
        run: pnpm lint

      # Le crochet de pré-commit peut être contourné (`--no-verify`, ou un
      # contributeur qui n'a jamais lancé `pnpm install`). Ce contrôle est le
      # filet : il échoue si un fichier n'est pas formaté, sans rien réécrire.
      - name: Prettier (contrôle, sans écriture)
        run: pnpm format:check

  audit:
    name: Dépendances vulnérables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Job SÉPARÉ, à dessein : un nouvel avis publié sur une dépendance
      # transitive peut faire rougir ce job sans qu'une seule ligne ait changé.
      # L'isoler évite de confondre « le code est cassé » et « le monde a
      # bougé ». Le seuil `high` est tenable : l'arbre est à 0 avis critique et
      # 0 avis haut depuis la mise à jour de Next 16.3.5 et les overrides pnpm.
      - name: pnpm audit (production, seuil haut)
        run: pnpm audit --prod --audit-level=high
